[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython"]
build-backend = "setuptools.build_meta"

[project]
name = "blade-ai"
version = "1.1.0"
description = "BladeAI Flask application for wind turbine aerodynamics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Michael Zhang", email = "mich@mich.com"}
]
keywords = ["flask", "wind", "turbine", "aerodynamics", "blade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "flask>=2.0.0,<3.0.0",
    "flask-sqlalchemy>=3.0.0",
    "requests>=2.28.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "ruamel.yaml>=0.17.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-flask>=1.2.0",
]

[project.urls]
Homepage = "https://gitee.com/michaelxdzhang/beaver-framework"
Repository = "https://gitee.com/michaelxdzhang/beaver-framework"

[tool.setuptools.packages.find]
where = ["."]
include = ["tests*"]
exclude = [".venv", "__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
