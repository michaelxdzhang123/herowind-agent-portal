<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeroGateway - Login</title>
    <link rel="stylesheet" href="{{ url_for('key_management_bp.static', filename='css/video-background.css') }}">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .signinpanel {
            width: 360px;
            margin: 10% auto 0 auto;
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 8px;
            padding: 40px 30px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .signinpanel .logopanel {
            text-align: center;
            margin-bottom: 30px;
        }
        .signinpanel .logopanel h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .signinpanel .logopanel h1 i {
            color: #1caf9a;
            margin-right: 8px;
        }
        .form-control {
            display: block;
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s, background 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #1caf9a;
            background: rgba(255, 255, 255, 0.2);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1caf9a;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: background 0.3s, transform 0.15s;
        }
        .btn-login:hover {
            background: #18a089;
            transform: translateY(-1px);
        }
        .error-msg {
            background: rgba(200, 40, 40, 0.6);
            padding: 10px 14px;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            border-left: 3px solid #e74c3c;
        }
    </style>
</head>
<body>

    <!-- Background video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="{{ url_for('key_management_bp.static', filename='video/turbine_seedance.mp4') }}" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="signinpanel">
        <div class="logopanel">
            <h1><i class="fa fa-bolt"></i>HeroGateway</h1>
        </div>
        <form action="/login" method="post">
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

</body>
</html>
