<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Herowind Agents Portal - 登录</title>
    <link rel="stylesheet" type="text/css" href="/static/css/normalize.css"/>
    <link rel="stylesheet" type="text/css" href="/static/css/demo.css"/>
    <link rel="stylesheet" type="text/css" href="/static/css/component.css"/>
    <style>
        /* Fullscreen background video */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            object-fit: cover;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -99;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        /* Make large-header transparent to show video */
        .large-header {
            background: transparent !important;
        }
        .demo-1 .large-header {
            background-image: none !important;
        }
        /* Keep canvas subtle behind form */
        #demo-canvas {
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- Background video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="/static/video/turbine_seedance.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

<div class="container demo-1">
    <div class="content">
        <div id="large-header" class="large-header">
            <canvas id="demo-canvas"></canvas>
            <div class="logo_box">
                <h1 align="left" style="color: white;font-family: 微软雅黑"> Herowind Agents Portal </h1>
                <form action="" method="post">
                    <div class="input_outer">
                        <span class="u_user"></span>
                        <input name="username" class="text" style="color: #FFFFFF !important" type="text"
                               placeholder="请输入账户:demo ">
                    </div>
                    <div class="input_outer" >
                        <span class="us_uer"></span>
                        <input name="password" class="text"
                               style="color: #FFFFFF !important; position:absolute; z-index:100;" value=""
                               type="password" placeholder="请输入密码:demo">
                    </div>
                    <form id="act-but submit"><button type="submit" style="width:330px;height:50px;border:none;color: #ffffff;text-align: center" class="act-but submit" align="middle">登录</button></form>
                </form>

            </div>
        </div>
    </div>
</div><!-- /container -->
<script src="/static/js/TweenLite.min.js"></script>
<script src="/static/js/EasePack.min.js"></script>
<script src="/static/js/rAF.js"></script>
<script src="/static/js/demo-1.js"></script>
<div style="text-align:center;">
</div>
</body>
</html>
