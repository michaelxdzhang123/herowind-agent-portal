<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可用模型</title>
    <link href="../static/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="../static/css/font-awesome.min.css?v=4.4.0" rel="stylesheet">
    <link href="../static/css/style.css?v=4.1.0" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="wrapper wrapper-content">

        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5>{{ info_dict.title }}</h5>
                    </div>
                    <div class="ibox-content">
                        {% for line in info_dict.descriptions %}
                        <p><i class="fa fa-cube" style="color: #1ab394;"></i> {{ line }}</p>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        {% if info_dict.code_repo %}
        <div class="row">
            <div class="col-sm-12">
                <div class="ibox float-e-margins">
                    <div class="ibox-title">
                        <h5><i class="fa fa-code"></i> 代码仓库</h5>
                    </div>
                    <div class="ibox-content">
                        <p>{{ info_dict.code_repo }}</p>
                        {% if info_dict.code_repo_url %}
                        <p><i class="fa fa-git"></i> <a href="{{ info_dict.code_repo_url }}" target="_blank">{{ info_dict.code_repo_url }}</a></p>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
        {% endif %}

    </div>
</div>
</body>
</html>
